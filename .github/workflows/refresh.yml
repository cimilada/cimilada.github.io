name: Refresh forecasts and deploy

on:
  schedule:
    - cron: "40 4 * * *"   # 07:40 in Mogadishu, after the 00 UTC model runs are published
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit the refresh stamp that keeps the schedule active
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Any failed required stage stops the run, so the last good page stays live.
      - name: Fetch forecasts
        run: |
          python fetch_wx.py
          python fetch_fc.py

      - name: Build page
        env:
          SHARE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python build.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub disables schedules in public repos after 60 days without activity.
      - name: Record refresh
        if: github.event_name == 'schedule'
        run: |
          date -u +%FT%TZ > data/last_refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_refresh.txt
          git commit -m "Daily forecast refresh" && git push || echo "nothing to commit"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
